<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RullzShop — Marketplace Digital</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--p:#FF3D71;--p2:#FF8C42;--gold:#FFD700;--bg:#F5F7FA;--card:#fff;--txt:#0F172A;--mut:#64748B;--line:#E2E8F0;--ok:#10B981;--warn:#F59E0B;--bad:#EF4444;--grad:linear-gradient(135deg,#FF3D71 0%,#FF8C42 100%);--grad-dark:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--txt);outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(255,61,113,.12)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12.5px;font-weight:700;color:#475569;margin:14px 0 6px}
.muted{color:var(--mut);font-size:12px}
.hidden{display:none!important}
#splash{position:fixed;inset:0;background:var(--grad-dark);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash.fade{opacity:0;pointer-events:none}
.splash-logo{font-size:46px;font-weight:900;letter-spacing:-2px;color:#fff;animation:bounceIn .8s ease}
.splash-logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.splash-sub{color:rgba(255,255,255,.5);font-size:13px;margin-top:8px;letter-spacing:2px}
.splash-glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,61,113,.35),transparent 70%);filter:blur(40px);animation:pulse 2s ease infinite}
@keyframes bounceIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}

#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--grad);position:relative;overflow:hidden}
#authScreen::before{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.1);top:-100px;right:-100px}
.auth-card{width:100%;max-width:400px;background:rgba(255,255,255,.98);border-radius:28px;padding:32px 26px;box-shadow:0 30px 80px rgba(0,0,0,.3);position:relative;z-index:1}
.logo{font-size:34px;font-weight:900;letter-spacing:-1.5px;text-align:center}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tagline{text-align:center;color:var(--mut);font-size:12.5px;margin:6px 0 24px;line-height:1.5}
.tabs{display:flex;background:#F1F5F9;border-radius:15px;padding:4px;margin-bottom:18px}
.tab{flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:800;color:var(--mut);transition:.25s}
.tab.active{background:#fff;color:var(--p);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.auth-card input{margin-bottom:11px}
.btn-primary{width:100%;padding:14px;border-radius:15px;font-weight:800;font-size:15px;color:#fff;background:var(--grad);box-shadow:0 10px 24px rgba(255,61,113,.35);transition:.15s}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.5}
.btn-outline{width:100%;padding:13px;border-radius:15px;font-weight:700;font-size:14px;color:var(--p);border:1.5px solid var(--p);background:#fff}
.hint{font-size:11.5px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.6}

#app{display:flex;flex-direction:column;min-height:100vh;max-width:560px;margin:0 auto;background:var(--bg);padding-bottom:84px}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--grad);color:#fff;box-shadow:0 4px 20px rgba(255,61,113,.25)}
.brand{font-size:21px;font-weight:900;letter-spacing:-.8px;color:#fff}
.brand span{color:rgba(255,255,255,.75)}
.topbar-right{display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:17px}
main{padding:14px;flex:1}
.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.sec-title{font-size:16px;font-weight:900;margin:4px 2px 12px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 4px 12px;z-index:50;box-shadow:0 -4px 20px rgba(0,0,0,.04)}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--mut);padding:4px 0;position:relative;transition:.2s}
.bottomnav button .ico{font-size:20px;line-height:1;transition:.2s}
.bottomnav button.active{color:var(--p)}
.bottomnav button.active .ico{transform:translateY(-2px) scale(1.1)}
.nav-badge{position:absolute;top:0;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}

.searchbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:13px 16px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:16px}
.searchbar input{border:none;padding:0;background:transparent;box-shadow:none!important;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);transition:.2s}

.pcard .body{padding:10px 11px 12px}

.pcard .pr{font-size:15px;font-weight:900;color:var(--p);margin-top:5px}
.pcard .sl{font-size:10.5px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:800}
.badge.prem{background:linear-gradient(135deg,#FFD700,#FFA500);color:#5A3D00}
.badge.free{background:#EDF2F7;color:#64748B}
.badge.ok{background:#D1FAE5;color:#065F46}
.badge.warn{background:#FEF3C7;color:#92400E}
.badge.bad{background:#FEE2E2;color:#991B1B}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:800;background:var(--p);color:#fff}
.row{display:flex;align-items:center;gap:11px}
.divider{height:1px;background:var(--line);margin:14px 0}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:none}
.avatar{border-radius:50%;object-fit:cover;flex-shrink:0;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}

#modal{position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
#modal.show{display:flex}
.modal-card{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:22px 20px 30px;animation:slideup .3s cubic-bezier(.16,1,.3,1)}
@keyframes slideup{from{transform:translateY(80px);opacity:.7}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h3{font-size:17px;font-weight:900}
.close-x{width:34px;height:34px;border-radius:50%;background:#F1F5F9;font-size:16px;display:flex;align-items:center;justify-content:center}

#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#0F172A;color:#fff;padding:13px 22px;border-radius:15px;font-size:13px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.chat-wrap{position:fixed;inset:0;background:#fff;z-index:80;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.chat-header{display:flex;align-items:center;gap:11px;padding:14px 16px;background:var(--grad);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.chat-header .back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px}
.chat-header .who{flex:1;min-width:0}
.chat-header .who .nm{font-size:14px;font-weight:800;display:flex;align-items:center;gap:5px}
.chat-header .who .st{font-size:10.5px;opacity:.8;margin-top:1px}
.chat-body{flex:1;overflow-y:auto;padding:16px;background:#F8FAFC;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.45;word-wrap:break-word;position:relative;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.mine{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.msg.theirs{align-self:flex-start;background:#fff;color:var(--txt);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .time{font-size:9.5px;opacity:.6;margin-top:3px;display:block;text-align:right}
.chat-input-bar{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom))}

.chat-input-bar button{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;font-size:17px;flex-shrink:0}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);padding:40px}

.chat-item .ci-last{font-size:12px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .ci-unread{min-width:18px;height:18px;border-radius:9px;background:var(--p);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}

.preview{width:120px;height:120px;object-fit:cover;border-radius:16px;margin-top:10px;display:none;border:1.5px solid var(--line)}
.wcard{display:flex;align-items:center;gap:13px;padding:15px;border-radius:16px;background:#fff;border:1.5px solid var(--line);margin-bottom:10px;transition:.15s}
.wcard:active{transform:scale(.98)}
.wcard .logo-w{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;flex-shrink:0}
.wcard .info{flex:1;min-width:0}
.wcard .info .nm{font-size:13.5px;font-weight:800}
.wcard .info .num{font-size:12px;color:var(--mut);margin-top:2px}

.plan{background:linear-gradient(150deg,#0F172A,#1E293B);color:#fff;border-radius:22px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.plan::before{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,215,0,.08);top:-60px;right:-40px}
.plan h2{font-size:20px;margin-bottom:3px;position:relative}
.plan .price{font-size:32px;font-weight:900;color:var(--gold);margin:10px 0 2px;position:relative}
.plan .price small{font-size:13px;font-weight:600;color:#94A3B8}
.benefit{display:flex;gap:10px;font-size:13px;padding:8px 0;color:#E2E8F0;align-items:flex-start;line-height:1.5;position:relative}
.benefit .ck{color:#4ADE80;font-weight:900;flex-shrink:0}
.benefit.no .ck{color:#F87171}
.btn-gold{width:100%;padding:15px;border-radius:15px;font-weight:900;font-size:15px;color:#3D2A00;background:linear-gradient(135deg,#FFD700,#FFA500);box-shadow:0 10px 24px rgba(255,180,0,.35);margin-top:14px}
</style>

<body>

<div id="splash">
  <div class="splash-glow"></div>
  <div class="splash-logo">Rullz<span>Shop</span></div>

<script type="module">

/* ================= UTIL ================= */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rp(n){ return 'Rp'+Number(n||0).toLocaleString('id-ID'); }
function dateFmt(t){ if(!t) return '-'; const d = t.toDate ? t.toDate() : new Date(t); return d.toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}

function compressImage(file,maxDim,quality,cb){
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){ const s=Math.min(maxDim/w,maxDim/h); w=Math.round(w*s); h=Math.round(h*s); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>toast('Gagal baca gambar');
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

function avatarHTML(u,size){
  if(!u) return `<div class="avatar" style="width:${size}px;height:${size}px;background:#CBD5E1"></div>`;
  if(u.avatar) return `<img class="avatar" src="${u.avatar}" style="width:${size}px;height:${size}px">`;
  const ch=(u.username||'?')[0].toUpperCase();
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${Math.round(size*0.42)}px">${ch}</div>`;
}

/* ================= BOOT ================= */
function boot(){
  const splash = document.getElementById('splash');
  const auth = document.getElementById('authScreen');

  try{
    app = initializeApp(firebaseConfig);
    db = getFirestore(app);
  }catch(e){
    alert('Firebase Error: '+e.message);
    return;
  }

  setTimeout(async ()=>{
    splash.classList.add('fade');
    setTimeout(()=>splash.style.display='none',500);

    const saved = localStorage.getItem('rullzUserId');
    if(saved){
      try {
        const snap = await getDoc(doc(db,'users',saved));
        if(snap.exists()){
          const data = snap.data();
          if(!data.blocked){ currentUser = {id:saved,...data}; enterApp(); return; }
          else { localStorage.removeItem('rullzUserId'); }
        } else { localStorage.removeItem('rullzUserId'); }
      } catch(e) { console.log(e); }
    }
    auth.classList.remove('hidden');
  }, 1200);
}

/* ================= AUTH ================= */
function switchAuth(mode){
  document.getElementById('tabLogin').classList.toggle('active',mode==='login');
  document.getElementById('tabRegister').classList.toggle('active',mode==='register');
  document.getElementById('loginForm').classList.toggle('hidden',mode!=='login');
  document.getElementById('registerForm').classList.toggle('hidden',mode!=='register');
}

async function doLogin(){
  const btn = document.getElementById('btnLogin');
  const uname = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  
  if(!uname||!pass) return toast('Isi username dan password');
  const unameLower = uname.toLowerCase();
  
  btn.disabled = true; btn.textContent = 'Memuat...';
  const resetBtn = setTimeout(() => { btn.disabled = false; btn.textContent = 'Masuk'; }, 6000);

  try{
    // BACKDOOR ADMIN
    if(unameLower === ADMIN_USER && pass === 'jenab123') {
        const adminRef = doc(db, 'users', ADMIN_USER);
        const adminSnap = await getDoc(adminRef);

function isPremium(u){
  return !!(u && u.isPremium && u.premiumUntil && u.premiumUntil > Date.now());
}

/* ================= ENTER APP ================= */
function enterApp(){
  try {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    startListeners();
    currentView = 'home';
    render();
  } catch(e) {
    console.error("Gagal masuk ke aplikasi:", e);
    toast("Terjadi kesalahan sistem saat memuat aplikasi.");
  }
}

function startListeners(){
  unsubProducts = onSnapshot(
    query(collection(db,'products'), orderBy('createdAt','desc')),
    snap => {
      products = snap.docs.map(d=>({id:d.id,...d.data()}));
      if(currentView==='home') renderGrid();
    },
    err => console.error("Products error:", err)
  );

  const qBuy = query(collection(db,'orders'), where('buyerId','==',currentUser.id));
  const qSell = query(collection(db,'orders'), where('sellerId','==',currentUser.id));
  let buyerOrders=[], sellerOrders=[];
  
  onSnapshot(qBuy, s=>{ 
    buyerOrders=s.docs.map(d=>({id:d.id,...d.data()})); 
    myOrders=[...buyerOrders,...sellerOrders]; 
    if(currentView==='orders') render(); 
  }, err=>console.error("Orders buyer error:",err));
  
  unsubOrders = onSnapshot(qSell, s=>{ 
    sellerOrders=s.docs.map(d=>({id:d.id,...d.data()})); 
    myOrders=[...buyerOrders,...sellerOrders]; 
    if(currentView==='orders') render(); 
  }, err=>console.error("Orders seller error:",err));

  unsubChats = onSnapshot(
    query(collection(db,'chats'), where('participants','array-contains',currentUser.id)),
    snap => {
      myChats = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.lastTime||0)-(a.lastTime||0));
      const unread = myChats.reduce((s,c)=>{ const u = (c.unread||{})[currentUser.id]||0; return s+u; },0);
      const badge = document.getElementById('chatBadge');
      if(badge) badge.innerHTML = unread>0 ? `<span class="nav-badge">${unread>99?'99+':unread}</span>` : '';
      if(currentView==='chat') render();
    },
    err => console.error("Chats error:", err)
  );
}

/* ================= NAV ================= */
function go(view){
  currentView = view; searchQuery=''; tmpImg='';
  if(activeChat){ closeChat(); return; }
  render();
}

function render(){
  if(!currentUser) return;
  document.getElementById('topPremium').innerHTML = isPremium(currentUser) ? '<span class="badge prem">⭐</span>' : '';
  ['home','chat','post','orders','profile'].forEach(v=>{
    const el = document.getElementById('nav-'+v);
    if(el) el.classList.toggle('active', currentView===v);
  });

  const main = document.getElementById('main');
  if(currentView==='home') main.innerHTML = viewHome();
  else if(currentView==='chat') main.innerHTML = viewChatList();
  else if(currentView==='post') main.innerHTML = viewPost();
  else if(currentView==='orders') main.innerHTML = viewOrders();
  else if(currentView==='profile') main.innerHTML = viewProfile();
  else if(currentView==='admin') main.innerHTML = viewAdmin();

  if(currentView==='home') renderGrid();
}

function renderGrid(){
  const grid = document.getElementById('productGrid');
  if(!grid) return;
  const q = (searchQuery||'').toLowerCase().trim();
  const list = products.filter(p=>{
    if(!q) return true;
    return (p.name+' '+(p.desc||'')+' '+p.sellerName).toLowerCase().includes(q);
  });
  if(list.length===0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">📦</div>
      <h3>${q?'Produk tidak ditemukan':'Belum ada produk'}</h3>
      <p class="muted" style="margin-top:8px">${q?'Coba kata lain.':'Jadilah penjual pertama!'}</p></div>`;
    return;
  }
  grid.innerHTML = list.map(p=>{
    const thumb = p.image ? `<img class="thumb" src="${p.image}" alt="">` : `<div class="thumb">🖼️</div>`;
    return `<div class="pcard" onclick="openProduct('${p.id}')">
      ${thumb}
      <div class="body">
        <div class="nm">${esc(p.name)}</div>
        <div class="pr">${rp(p.price)}</div>
        <div class="sl">${p.sellerPremium?'<span class="verified">✔</span>':''} ${esc(p.sellerName)}</div>

  }).join('');
}

async function confirmOrder(productId){
  const p = products.find(x=>x.id===productId); if(!p) return;
  const note = (document.getElementById('orderNote')?.value||'').trim();
  try{
    const orderData = {
      productId: p.id, productName: p.name, productPrice: p.price, productImage: p.image || '',
      buyerId: currentUser.id, buyerName: currentUser.username, buyerAvatar: currentUser.avatar || '',
      sellerId: p.sellerId, sellerName: p.sellerName,
      sellerEwalletType: p.ewalletType || '', sellerEwalletNumber: p.ewalletNumber || '', sellerPhone: p.phone || '',
      note, status: 'Menunggu Pembayaran', resi: '', createdAt: Date.now(),
      timeline: [{status:'Menunggu Pembayaran', time:Date.now(), note:'Pesanan dibuat'}]
    };
    await addDoc(collection(db,'orders'), orderData);
    const chatId = [currentUser.id, p.sellerId].sort().join('_');
    await ensureChat(chatId, currentUser.id, p.sellerId);
    await addDoc(collection(db,'chats',chatId,'messages'), {
      from: currentUser.id, text: `Halo, saya baru pesan *${p.name}* (${rp(p.price)}). Mohon info pembayaran ya 🙏`, time: Date.now()
    });
    await updateDoc(doc(db,'chats',chatId), { lastMessage: `Halo, saya baru pesan ${p.name}`, lastTime: Date.now(), lastFrom: currentUser.id });
    closeModal(); currentView='orders'; orderTab='buyer'; render();
    toast('✅ Pesanan dibuat!');
    setTimeout(()=>openChatWith(p.sellerId, p.id), 500);
  }catch(e){ toast('Error: '+e.message); }
}

function viewOrders(){
  const buyerOrders = myOrders.filter(o=>o.buyerId===currentUser.id).sort((a,b)=>b.createdAt-a.createdAt);
  const sellerOrders = myOrders.filter(o=>o.sellerId===currentUser.id).sort((a,b)=>b.createdAt-a.createdAt);
  const list = orderTab==='buyer' ? buyerOrders : sellerOrders;
  return `
    <div class="tabs" style="margin-bottom:14px">
      <button class="tab ${orderTab==='buyer'?'active':''}" onclick="window.setOrderTab('buyer')">🛒 Pembelian (${buyerOrders.length})</button>
      <button class="tab ${orderTab==='seller'?'active':''}" onclick="window.setOrderTab('seller')">🏪 Penjualan (${sellerOrders.length})</button>

    ${list.length===0
      ? `<div class="empty"><div class="big">📦</div><h3>Belum ada pesanan</h3>
        <p class="muted" style="margin-top:8px">${orderTab==='buyer'?'Yuk belanja di beranda.':'Produkmu belum dibeli.'}</p></div>`
      : list.map(o=>orderCard(o,orderTab)).join('')}

function statusColor(s){
  if(s==='Menunggu Pembayaran'||s==='Diproses Penjual'||s==='Dikirim') return 'warn';
  if(s==='Sampai Tujuan'||s==='Selesai') return 'ok';
  return 'free';
}

function orderCard(o, role){
  const isBuyer = role==='buyer';
  let actions = '';
  if(isBuyer){
    if(o.status==='Menunggu Pembayaran') actions = `<button class="btn-primary" style="padding:11px;font-size:13px" onclick="markPaid('${o.id}')">✅ Saya Sudah Bayar</button>`;
    else if(o.status==='Sampai Tujuan') actions = `<button class="btn-primary" style="padding:11px;font-size:13px" onclick="completeOrder('${o.id}')">📬 Pesanan Diterima</button>`;
  } else {
    if(o.status==='Diproses Penjual') actions = `<button class="btn-primary" style="padding:11px;font-size:13px" onclick="openShip('${o.id}')">🚚 Kirim Pesanan</button>`;
    else if(o.status==='Dikirim') actions = `<button class="btn-primary" style="padding:11px;font-size:13px" onclick="markArrived('${o.id}')">📍 Tandai Sampai</button>`;
  }
  return `<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:11px">
      <span class="muted">${dateFmt(o.createdAt)}</span>
      <span class="badge ${statusColor(o.status)}">${o.status}</span>
    </div>
    <div class="row" style="align-items:flex-start">
      ${o.productImage
        ? `<img src="${o.productImage}" style="width:60px;height:60px;border-radius:13px;object-fit:cover;flex-shrink:0">`
        : `<div style="width:60px;height:60px;border-radius:13px;background:#FFE4EC;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0">🖼️</div>`}
      <div style="flex:1;min-width:0">
        <div style="font-size:13.5px;font-weight:800;line-height:1.35">${esc(o.productName)}</div>
        <div style="font-size:16px;font-weight:900;color:var(--p);margin-top:4px">${rp(o.productPrice)}</div>
        <div class="muted" style="margin-top:3px">${isBuyer?'Penjual: '+esc(o.sellerName):'Pembeli: '+esc(o.buyerName)}</div>
      </div>
    </div>
    ${o.note?`<div style="margin-top:10px;background:#FEF3C7;border-radius:11px;padding:9px;font-size:12px;color:#92400E">📝 ${esc(o.note)}</div>`:''}
    <div style="margin-top:11px;display:flex;gap:7px">
      <button class="btn-outline" style="padding:10px;font-size:12.5px;flex:1" onclick="openTracking('${o.id}')">📍 Lacak</button>
      <button class="btn-outline" style="padding:10px;font-size:12.5px;flex:1" onclick="openChatWith('${isBuyer?o.sellerId:o.buyerId}','${o.productId}')">💬 Chat</button>
    </div>
    ${actions?`<div style="margin-top:9px">${actions}</div>`:''}
  </div>`;
}

function markPaid(id){
  if(!confirm('Konfirmasi sudah membayar?')) return;
  const order = myOrders.find(o=>o.id===id);
  const timeline = [...(order.timeline||[]), {status:'Diproses Penjual', time:Date.now(), note:'Pembeli sudah bayar'}];
  updateDoc(doc(db,'orders',id), {status:'Diproses Penjual', timeline})
    .then(()=>toast('✅ Pembayaran dikonfirmasi'))
    .catch(e=>toast('Error: '+e.message));
}

function openShip(id){

function doShip(id){

  const timeline = [...(order.timeline||[]), {status:'Dikirim', time:Date.now(), note:resi}];
  updateDoc(doc(db,'orders',id), {status:'Dikirim', resi, timeline})
    .then(()=>{ closeModal(); toast('🚚 Ditandai dikirim'); })
    .catch(e=>toast('Error: '+e.message));

function markArrived(id){
  const order = myOrders.find(o=>o.id===id);

  updateDoc(doc(db,'orders',id), {status:'Sampai Tujuan', timeline})
    .then(()=>toast('📍 Ditandai sampai'))

function completeOrder(id){
  if(!confirm('Konfirmasi pesanan sudah diterima?')) return;

  const timeline = [...(order.timeline||[]), {status:'Selesai', time:Date.now(), note:'Pesanan selesai'}];

function openTracking(id){
  const o = myOrders.find(x=>x.id===id); if(!o) return;
  const items = (o.timeline||[]).map((t,i)=>`<div class="tl-item done">
    <div class="t">${esc(t.status)}</div>
    <div class="d">${dateFmt(t.time)}</div>

async function ensureChat(chatId, uid1, uid2){
  const ref = doc(db,'chats',chatId);
  const snap = await getDoc(ref);
  if(!snap.exists()){
    const u1Snap = await getDoc(doc(db,'users',uid1));
    const u2Snap = await getDoc(doc(db,'users',uid2));
    const users = {};
    if(u1Snap.exists()) users[uid1] = {username:u1Snap.data().username, avatar:u1Snap.data().avatar||''};
    if(u2Snap.exists()) users[uid2] = {username:u2Snap.data().username, avatar:u2Snap.data().avatar||''};
    await setDoc(ref, {participants:[uid1,uid2], users, lastMessage:'', lastTime:0, lastFrom:'', unread:{}});
  }
}

async function openChatWith(otherId, productId){
  if(otherId===currentUser.id) return toast('Itu kamu sendiri');
  const chatId = [currentUser.id, otherId].sort().join('_');

    await ensureChat(chatId, currentUser.id, otherId);
    closeModal(); openChat(chatId);
  }catch(e){ toast('Error: '+e.message); }
}

async function openChat(chatId){
  activeChat = {id:chatId};
  const wrap = document.createElement('div');
  wrap.className = 'chat-wrap'; wrap.id = 'chatWrap';
  wrap.innerHTML = `
    <div class="chat-header">
      <button class="back" onclick="closeChat()">←</button>
      <div class="who"><div class="nm" id="chatName">Loading...</div><div class="st" id="chatStatus">online</div></div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input-bar">
      <input id="chatInput" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">➤</button>
    </div>
  `;
  document.body.appendChild(wrap);
  document.body.style.overflow='hidden';

  const chatSnap = await getDoc(doc(db,'chats',chatId));
  if(!chatSnap.exists()){ toast('Chat tidak ditemukan'); closeChat(); return; }
  const chatData = chatSnap.data(); activeChat.data = chatData;
  const otherId = chatData.participants.find(p=>p!==currentUser.id);
  const otherInfo = chatData.users?.[otherId] || {username:'User'};
  document.getElementById('chatName').innerHTML = esc(otherInfo.username);

  try{
    const unread = {...(chatData.unread||{})}; unread[currentUser.id] = 0;
    await updateDoc(doc(db,'chats',chatId), {unread});
  }catch(e){}

  if(unsubMessages) unsubMessages();
  unsubMessages = onSnapshot(
    query(collection(db,'chats',chatId,'messages'), orderBy('time','asc')),
    snap => {
      const body = document.getElementById('chatBody');
      if(!body) return;
      const msgs = snap.docs.map(d=>({id:d.id,...d.data()}));
      if(msgs.length===0){
        body.innerHTML = `<div class="chat-empty"><div style="font-size:52px;opacity:.4">💬</div><p style="margin-top:10px">Belum ada pesan. Mulai percakapan!</p></div>`;
        return;
      }
      const wasAtBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 100;
      body.innerHTML = msgs.map(m=>{
        const mine = m.from===currentUser.id;
        return `<div class="msg ${mine?'mine':'theirs'}">${esc(m.text)}<span class="time">${dateFmt(m.time)}</span></div>`;
      }).join('');
      if(wasAtBottom || msgs.length>0) body.scrollTop = body.scrollHeight;
    }
  );
}

function closeChat(){
  if(unsubMessages){ unsubMessages(); unsubMessages=null; }
  const w = document.getElementById('chatWrap');
  if(w) w.remove();
  document.body.style.overflow='';
  activeChat = null; render();
}

async function sendMsg(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text || !activeChat) return;
  input.value = '';
  try{
    await addDoc(collection(db,'chats',activeChat.id,'messages'), { from: currentUser.id, text, time: Date.now() });
    const chatSnap = await getDoc(doc(db,'chats',activeChat.id));
    const otherId = chatSnap.data().participants.find(p=>p!==currentUser.id);
    const unread = {...(chatSnap.data().unread||{})}; unread[otherId] = (unread[otherId]||0) + 1;
    await updateDoc(doc(db,'chats',activeChat.id), {
      lastMessage: text.length>40 ? text.slice(0,40)+'...' : text,
      lastTime: Date.now(), lastFrom: currentUser.id, unread
    });
  }catch(e){ toast('Gagal kirim: '+e.message); }
}

async function saveUsername(){
  const val = document.getElementById('newUsername').value.trim();
  if(val.length<3) return toast('Minimal 3 karakter');
  if(/\s/.test(val)) return toast('Tidak boleh spasi');
  if(!/^[a-zA-Z0-9._]+$/.test(val)) return toast('Hanya huruf, angka, titik, _');
  
  const valLower = val.toLowerCase();
  if(valLower === currentUser.usernameLower) return closeModal();
  
  try{
    if(valLower === ADMIN_USER) return toast('Username ini dilindungi');

    const newRef = doc(db, 'users', valLower);
    const snap = await getDoc(newRef);
    if(snap.exists()) return toast('Username sudah dipakai');
    
    const oldId = currentUser.id;
    const newData = { ...currentUser, username: val, usernameLower: valLower };
    delete newData.id;
    
    await setDoc(newRef, newData);
    await deleteDoc(doc(db, 'users', oldId));
    
    // Update produk & pesanan lama agar tidak hilang
    const myProdQ = query(collection(db,'products'), where('sellerId','==',oldId));
    const prodSnap = await getDocs(myProdQ);
    prodSnap.docs.forEach(async d=>{ 
        await updateDoc(doc(db,'products',d.id), {sellerId: valLower, sellerName:val}); 
    });

    const buySnap = await getDocs(query(collection(db,'orders'), where('buyerId','==',oldId)));
    buySnap.docs.forEach(async d=>{ 
        await updateDoc(doc(db,'orders',d.id), {buyerId: valLower, buyerName:val}); 
    });
    
    const sellSnap = await getDocs(query(collection(db,'orders'), where('sellerId','==',oldId)));
    sellSnap.docs.forEach(async d=>{ 
        await updateDoc(doc(db,'orders',d.id), {sellerId: valLower, sellerName:val}); 
    });
    
    const chatSnap = await getDocs(query(collection(db,'chats'), where('participants','array-contains',oldId)));
    chatSnap.docs.forEach(async d=>{
        const chatData = d.data();
        const newParticipants = chatData.participants.map(p => p === oldId ? valLower : p);
        await updateDoc(doc(db,'chats',d.id), {participants: newParticipants});
    });
    
    // Update data lokal
    currentUser.id = valLower;
    currentUser.username = val;
    currentUser.usernameLower = valLower;
    localStorage.setItem('rullzUserId', valLower);
    
    closeModal(); render(); toast('✅ Username diperbarui');
  }catch(e){ toast('Error: '+e.message); }
}

        <button style="width:38px;height:34px;border-radius:11px;background:#F1F5F9;font-size:15px" onclick="togglePremium('${u.id}')">${isPremium(u)?'⭐':'☆'}</button>
      </div>
    </div>`).join('');

  return `
    <div class="card" style="background:linear-gradient(135deg,#0F172A,#1E293B);color:#fff">
      <div class="row" style="justify-content:space-between">
        <div><div style="font-size:16px;font-weight:900">🛡️ Panel Admin</div>
        <div style="font-size:11.5px;opacity:.65;margin-top:2px">${esc(currentUser.username)}</div></div>
        <button style="background:rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:11px;font-weight:800;font-size:12px" onclick="go('profile')">← Kembali</button>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:18px;text-align:center">
        <div style="flex:1"><div style="font-size:19px;font-weight:900">${totalUsers}</div><div style="font-size:10.5px;opacity:.6">Pengguna</div></div>
        <div style="flex:1"><div style="font-size:19px;font-weight:900">${blockedCount}</div><div style="font-size:10.5px;opacity:.6">Diblokir</div></div>
        <div style="flex:1"><div style="font-size:19px;font-weight:900">${products.length}</div><div style="font-size:10.5px;opacity:.6">Produk</div></div>
      </div>
    </div>
    <div class="card">
      <div class="sec-title" style="margin-bottom:4px">👥 Pengguna Terdaftar</div>
      <p class="muted" style="margin-bottom:10px">Admin dapat melihat kredensial & memblokir.</p>
      ${rows || '<div class="empty" style="padding:30px"><p class="muted">Belum ada pengguna.</p></div>'}
    </div>`;
}

function toggleBlock(id){
  const u = allUsers.find(x=>x.id===id); if(!u) return;
  updateDoc(doc(db,'users',id), {blocked:!u.blocked}).then(()=>{
    toast(u.blocked?'🔓 User dibuka':'🚫 User diblokir');
    if(id===currentUser.id && !u.blocked){ setTimeout(()=>logout(),800); }
  }).catch(e=>toast('Error: '+e.message));
}

function togglePremium(id){
  const u = allUsers.find(x=>x.id===id); if(!u) return;
  const action = isPremium(u) 
    ? updateDoc(doc(db,'users',id), {isPremium:false, premiumUntil:0})
    : updateDoc(doc(db,'users',id), {isPremium:true, premiumUntil:Date.now()+30*86400000});
  action.then(()=>toast('✅ Premium diubah')).catch(e=>toast('Error: '+e.message));
}

/* ================= MODAL ================= */
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow = '';
}

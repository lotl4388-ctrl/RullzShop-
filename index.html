<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RullzShop — Marketplace Digital</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F4F7FB; --card:#fff; --txt:#1E1E24; --mut:#71717A; --line:#E4E4E7;
  --input-bg:#fff; --input-txt:#1E1E24; --chat-bg:#F4F7FB; --chat-theirs:#fff;
  --p:#E100FF; --p2:#FF7300; --p3:#7F00FF; --accent:#00D2FF; --gold:#FFD700;
  --ok:#10B981; --warn:#F59E0B; --bad:#EF4444;
  --grad:linear-gradient(135deg, #7F00FF 0%, #E100FF 40%, #FF7300 100%);
  --grad-dark:linear-gradient(135deg, #1E1E24 0%, #2D2D35 100%);
}
body.dark-mode {
  --bg:#121212; --card:#1E1E1E; --txt:#F8FAFC; --mut:#A1A1AA; --line:#333333;
  --input-bg:#2D2D35; --input-txt:#F8FAFC; --chat-bg:#121212; --chat-theirs:#2D2D35;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:var(--input-bg);color:var(--input-txt);outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(225,0,255,.12)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:14px 0 6px}
.muted{color:var(--mut);font-size:12px}
.hidden{display:none!important}

#splash{position:fixed;inset:0;background:var(--grad-dark);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash.fade{opacity:0;pointer-events:none}
.splash-logo{font-size:46px;font-weight:900;letter-spacing:-2px;color:#fff;animation:bounceIn .8s ease}
.splash-logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.splash-sub{color:rgba(255,255,255,.5);font-size:13px;margin-top:8px;letter-spacing:2px}
.splash-glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(225,0,255,.35),transparent 70%);filter:blur(40px);animation:pulse 2s ease infinite}
@keyframes bounceIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}

#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--grad);position:relative;overflow:hidden}
.auth-card{width:100%;max-width:400px;background:var(--card);border-radius:28px;padding:32px 26px;box-shadow:0 30px 80px rgba(0,0,0,.3);position:relative;z-index:1}
.logo{font-size:34px;font-weight:900;letter-spacing:-1.5px;text-align:center;color:var(--txt)}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tagline{text-align:center;color:var(--mut);font-size:12.5px;margin:6px 0 24px;line-height:1.5}
.tabs{display:flex;background:var(--bg);border-radius:15px;padding:4px;margin-bottom:18px}
.tab{flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:800;color:var(--mut);transition:.25s}
.tab.active{background:var(--card);color:var(--p);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.auth-card input{margin-bottom:11px}
.btn-primary{width:100%;padding:14px;border-radius:15px;font-weight:800;font-size:15px;color:#fff;background:var(--grad);box-shadow:0 10px 24px rgba(225,0,255,.35);transition:.15s}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.5}
.btn-outline{width:100%;padding:13px;border-radius:15px;font-weight:700;font-size:14px;color:var(--p);border:1.5px solid var(--p);background:var(--card)}
.hint{font-size:11.5px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.6}

#app{display:flex;flex-direction:column;min-height:100vh;max-width:560px;margin:0 auto;background:var(--bg);padding-bottom:84px}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--grad);color:#fff;box-shadow:0 4px 20px rgba(127,0,255,.25)}
.brand{font-size:21px;font-weight:900;letter-spacing:-.8px;color:#fff}
.brand span{color:rgba(255,255,255,.75)}
.topbar-right{display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:17px;transition:.2s;position:relative}
.icon-btn:active{transform:scale(.9)}
main{padding:14px;flex:1}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.04);border:1px solid var(--line)}
.sec-title{font-size:16px;font-weight:900;margin:4px 2px 12px;color:var(--txt)}

.bottomnav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 4px 12px;z-index:50;box-shadow:0 -4px 20px rgba(0,0,0,.04)}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--mut);padding:4px 0;position:relative;transition:.2s}
.bottomnav button .ico{font-size:20px;line-height:1;transition:.2s}
.bottomnav button.active{color:var(--p)}
.bottomnav button.active .ico{transform:translateY(-2px) scale(1.1)}
.nav-badge{position:absolute;top:0;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:9px;background:var(--accent);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}

.searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:13px 16px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:16px;border:1px solid var(--line)}
.searchbar input{border:none;padding:0;background:transparent;box-shadow:none!important;font-size:14px}
.filter-tabs{display:flex;gap:8px;margin-bottom:14px}
.filter-tabs button{flex:1;padding:10px;border-radius:12px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--mut);transition:.2s}
.filter-tabs button.active{background:var(--p);color:#fff;border-color:var(--p)}

.ad-container{border-radius:20px;overflow:hidden;margin-bottom:18px;box-shadow:0 10px 25px rgba(225,0,255,.15);background:var(--grad);position:relative}
.ad-media{width:100%;height:auto;max-height:300px;object-fit:cover;display:block}
.ad-fallback{padding:18px 20px;color:#fff}
.ad-fallback h2{font-size:16px;font-weight:900;margin-bottom:6px;text-shadow:0 2px 4px rgba(0,0,0,.15)}
.ad-fallback p{font-size:12.5px;line-height:1.5;font-weight:500;margin-bottom:8px;opacity:0.95}
.ad-fallback .tags{display:flex;flex-wrap:wrap;gap:6px}
.ad-fallback .tags span{background:rgba(255,255,255,.25);backdrop-filter:blur(5px);padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:700}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);transition:.2s;position:relative;border:1px solid var(--line)}
.pcard:active{transform:scale(.97)}
.pcard .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:linear-gradient(135deg,#F3E8FF,#FFE4EC);display:flex;align-items:center;justify-content:center;font-size:36px;color:#D8B4FE}
.pcard .body{padding:10px 11px 12px}
.pcard .nm{font-size:12.5px;font-weight:600;line-height:1.35;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--txt)}
.pcard .pr{font-size:15px;font-weight:900;color:var(--p);margin-top:5px}
.pcard .sl{font-size:10.5px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wish-btn{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:14px;backdrop-filter:blur(4px);z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.verified{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--accent);color:#fff;font-size:9px;font-weight:900;flex-shrink:0}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:800}
.badge.prem{background:linear-gradient(135deg,#FFD700,#FFA500);color:#5A3D00}
.badge.free{background:#EDF2F7;color:#64748B}
.badge.ok{background:#D1FAE5;color:#065F46}
.badge.warn{background:#FEF3C7;color:#92400E}
.badge.bad{background:#FEE2E2;color:#991B1B}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:800;background:var(--accent);color:#fff}
.row{display:flex;align-items:center;gap:11px}
.divider{height:1px;background:var(--line);margin:14px 0}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:none}
.avatar{border-radius:50%;object-fit:cover;flex-shrink:0;border:2.5px solid var(--line)}

#modal{position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
#modal.show{display:flex}
.modal-card{background:var(--card);color:var(--txt);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:22px 20px 30px;animation:slideup .3s cubic-bezier(.16,1,.3,1)}
@keyframes slideup{from{transform:translateY(80px);opacity:.7}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h3{font-size:17px;font-weight:900;color:var(--txt)}
.close-x{width:34px;height:34px;border-radius:50%;background:var(--bg);color:var(--txt);font-size:16px;display:flex;align-items:center;justify-content:center}

#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);padding:13px 22px;border-radius:15px;font-size:13px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.chat-wrap{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.chat-header{display:flex;align-items:center;gap:11px;padding:14px 16px;background:var(--grad);color:#fff}
.chat-header .back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.chat-header .who{flex:1;min-width:0}
.chat-header .who .nm{font-size:14px;font-weight:800;color:#fff}
.chat-body{flex:1;overflow-y:auto;padding:16px;background:var(--chat-bg);display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.45;word-wrap:break-word;position:relative}
.msg.mine{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.msg.theirs{align-self:flex-start;background:var(--chat-theirs);color:var(--txt);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .time{font-size:9.5px;opacity:.6;margin-top:3px;display:block;text-align:right}
.msg img{max-width:100%;border-radius:10px;margin-bottom:6px;border:2px solid rgba(255,255,255,.3)}
.msg.theirs img{border-color:var(--line)}
.chat-input-bar{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom));align-items:center}
.chat-input-bar .img-btn{width:44px;height:44px;border-radius:50%;background:var(--bg);color:var(--txt);font-size:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chat-input-bar input{flex:1;border-radius:22px;padding:11px 16px;margin:0;background:var(--bg);border:none}
.chat-input-bar button.send{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);padding:40px}

.chat-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chat-item:last-child{border-bottom:none}
.chat-item .ci-info{flex:1;min-width:0}
.chat-item .ci-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-item .ci-name{font-size:13.5px;font-weight:800;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .ci-time{font-size:10.5px;color:var(--mut);flex-shrink:0}
.chat-item .ci-last{font-size:12px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .ci-unread{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}

.preview{width:120px;height:120px;object-fit:cover;border-radius:16px;margin-top:10px;display:none;border:1.5px solid var(--line)}
.plan{background:var(--grad-dark);color:#fff;border-radius:22px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.plan h2{font-size:20px;margin-bottom:3px;position:relative}
.plan .price{font-size:32px;font-weight:900;color:var(--gold);margin:10px 0 2px;position:relative}
.plan .price small{font-size:13px;font-weight:600;color:#94A3B8}
.benefit{display:flex;gap:10px;font-size:13px;padding:8px 0;color:#E2E8F0;align-items:flex-start;line-height:1.5;position:relative}
.benefit .ck{color:#4ADE80;font-weight:900;flex-shrink:0}
.benefit.no .ck{color:#F87171}
.btn-gold{width:100%;padding:15px;border-radius:15px;font-weight:900;font-size:15px;color:#3D2A00;background:linear-gradient(135deg,#FFD700,#FFA500);box-shadow:0 10px 24px rgba(255,180,0,.35);margin-top:14px}

/* ULASAN & RATING */
.review-item{padding:12px;border-bottom:1px solid var(--line);font-size:12.5px}
.review-item:last-child{border-bottom:none}
.stars-display{color:var(--gold);font-size:16px;letter-spacing:2px;margin-bottom:4px}
/* VOUCHER */
.voucher-input{display:flex;gap:6px;margin-bottom:12px}
.voucher-input input{flex:1;padding:10px;font-size:12.5px}
.voucher-input button{padding:0 16px;background:var(--p);color:#fff;border-radius:12px;font-weight:800;font-size:12px}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-glow"></div>
  <div class="splash-logo">Rullz<span>Shop</span></div>
  <div class="splash-sub">MARKETPLACE DIGITAL</div>
</div>

<div id="toast"></div>

<div id="authScreen" class="hidden">
  <div class="auth-card">
    <div class="logo">Rullz<span>Shop</span></div>
    <p class="tagline">Jual beli aplikasi & produk digital<br>dari seluruh dunia 🌍</p>
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchAuth('login')">Masuk</button>
      <button class="tab" id="tabRegister" onclick="switchAuth('register')">Daftar</button>
    </div>
    <div id="loginForm">
      <input id="loginUser" placeholder="Username" autocomplete="username">
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn-primary" id="btnLogin" onclick="doLogin()">Masuk</button>
      <p class="hint">Belum punya akun? Klik <b>Daftar</b>.</p>
    </div>
    <div id="registerForm" class="hidden">
      <input id="regUser" placeholder="Username baru" autocomplete="username">
      <input id="regPass" type="password" placeholder="Password (min 5 karakter)" autocomplete="new-password">
      <input id="regPass2" type="password" placeholder="Ulangi password" autocomplete="new-password">
      <button class="btn-primary" id="btnRegister" onclick="doRegister()">Buat Akun</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand" onclick="go('home')">Rullz<span>Shop</span></div>
    <div class="topbar-right">
      <span id="topPremium"></span>
      <button class="icon-btn" onclick="showNotifications()" style="position:relative">
        🔔<span id="notifDot" class="hidden" style="position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--bad);border-radius:50%;border:2px solid #fff"></span>
      </button>
      <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
      <button class="icon-btn" onclick="go('profile')">👤</button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="bottomnav">
    <button id="nav-home" onclick="go('home')"><span class="ico">🏠</span>Beranda</button>
    <button id="nav-chat" onclick="go('chat')"><span class="ico">💬</span>Chat<span id="chatBadge"></span></button>
    <button id="nav-post" onclick="go('post')"><span class="ico">➕</span>Jual</button>
    <button id="nav-orders" onclick="go('orders')"><span class="ico">📦</span>Pesanan</button>
    <button id="nav-profile" onclick="go('profile')"><span class="ico">👤</span>Profil</button>
  </nav>
</div>

<div id="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card" id="modalBody"></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getFirestore, collection, doc, addDoc, setDoc, getDoc, getDocs, query, where, orderBy, onSnapshot, updateDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA_G_PE01-iTlI_9ox3FBLxtJ1qJ98gIQw",
  authDomain: "rullzshop-5bc1f.firebaseapp.com",
  projectId: "rullzshop-5bc1f",
  storageBucket: "rullzshop-5bc1f.firebasestorage.app",
  messagingSenderId: "400159656754",
  appId: "1:400159656754:web:38e1962bdbdd7fed43652b"
};

let db, app;
let currentUser = null;
let products = [];
let myOrders = [];
let myChats = [];
let ads = []; 
let allVouchers = [];
let currentReviews = [];
let activeProductIdForReview = null;

let unsubProducts = null, unsubOrders = null, unsubChats = null, unsubMessages = null, unsubAds = null, unsubAllUsers = null, unsubVouchers = null, unsubReviews = null;
let currentView = 'home';
let searchQuery = '';
let tmpImg = '';
let orderTab = 'buyer';
let activeChat = null;
let homeFilter = 'all';
let appliedVoucher = null;

const EWALLETS = [
  {name:'DANA', color:'#118EEA', icon:'💙'}, {name:'OVO', color:'#4C3494', icon:'💜'},
  {name:'GoPay', color:'#00AA13', icon:'💚'}, {name:'ShopeePay', color:'#EE4D2D', icon:'🧡'},
  {name:'LinkAja', color:'#E82529', icon:'❤️'}
];
const WA_PREMIUM = 'https://wa.me/6285189022148?text=Hallo%20kak%20@RullzOfficial%20saya%20mau%20pesan%20aplikasi%20Premium%20%F0%9F%99%8F%E2%98%BA%EF%B8%8F';
const FREE_POST_LIMIT = 10;
const ADMIN_USER = 'rullzpreset';

/* ================= UTIL & THEME ================= */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rp(n){ return 'Rp'+Number(n||0).toLocaleString('id-ID'); }
function dateFmt(t){ if(!t) return '-'; const d = t.toDate ? t.toDate() : new Date(t); return d.toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

function initTheme() {
  const savedTheme = localStorage.getItem('rullzTheme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    document.getElementById('themeToggleBtn').textContent = '☀️';
  } else {
    document.body.classList.remove('dark-mode');
    document.getElementById('themeToggleBtn').textContent = '🌙';
  }
}
function toggleTheme() {
  const isDark = document.body.classList.toggle('dark-mode');
  localStorage.setItem('rullzTheme', isDark ? 'dark' : 'light');
  document.getElementById('themeToggleBtn').textContent = isDark ? '☀️' : '🌙';
}

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}

function compressImage(file,maxDim,quality,cb){
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){ const s=Math.min(maxDim/w,maxDim/h); w=Math.round(w*s); h=Math.round(h*s); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>toast('Gagal baca gambar');
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

function avatarHTML(u,size){

  const ch=(u.username||'?')[0].toUpperCase();
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${Math.round(size*0.42)}px">${ch}</div>`;
}

/* ================= ENTER APP ================= */
function enterApp(){
  try {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    startListeners();
    currentView = 'home'; homeFilter = 'all'; render();
  } catch(e) { console.error(e); toast("Terjadi kesalahan sistem."); }
}

function startListeners(){
  unsubProducts = onSnapshot(query(collection(db,'products'), orderBy('createdAt','desc')),
    snap => { products = snap.docs.map(d=>({id:d.id,...d.data()})); if(currentView==='home') renderGrid(); },
    err => console.error("Products error:", err)
  );

  unsubAds = onSnapshot(query(collection(db,'ads'), orderBy('createdAt','desc')),
    snap => { ads = snap.docs.map(d=>({id:d.id,...d.data()})); if(currentView==='home') renderAdBanner(); },
    err => console.error("Ads error:", err)
  );

  unsubVouchers = onSnapshot(collection(db,'vouchers'), snap => {
    allVouchers = snap.docs.map(d => ({id:d.id, ...d.data()}));
  });

  const qBuy = query(collection(db,'orders'), where('buyerId','==',currentUser.id));
  const qSell = query(collection(db,'orders'), where('sellerId','==',currentUser.id));
  let buyerOrders=[], sellerOrders=[];
  
  onSnapshot(qBuy, s=>{ 
    buyerOrders=s.docs.map(d=>({id:d.id,...d.data()})); 
    myOrders=[...buyerOrders,...sellerOrders]; if(currentView==='orders') render(); 
    updateNotifDot();
  }, err=>console.error(err));
  
  unsubOrders = onSnapshot(qSell, s=>{ 
    sellerOrders=s.docs.map(d=>({id:d.id,...d.data()})); 
    myOrders=[...buyerOrders,...sellerOrders]; if(currentView==='orders') render(); 
    updateNotifDot();
  }, err=>console.error(err));

  unsubChats = onSnapshot(query(collection(db,'chats'), where('participants','array-contains',currentUser.id)),
    snap => {
      myChats = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.lastTime||0)-(a.lastTime||0));
      const unread = myChats.reduce((s,c)=>{ const u = (c.unread||{})[currentUser.id]||0; return s+u; },0);
      const badge = document.getElementById('chatBadge');
      if(badge) badge.innerHTML = unread>0 ? `<span class="nav-badge">${unread>99?'99+':unread}</span>` : '';
      if(currentView==='chat') render();
      updateNotifDot();
    }, err => console.error("Chats error:", err)
  );
}

function updateNotifDot() {
  const unreadChats = myChats.reduce((s,c)=> s + ((c.unread||{})[currentUser.id]||0), 0);
  const pendingSellerOrders = myOrders.filter(o => o.sellerId === currentUser.id && o.status === 'Diproses Penjual').length;
  const dot = document.getElementById('notifDot');
  if(dot) {
    if(unreadChats > 0 || pendingSellerOrders > 0) dot.classList.remove('hidden');
    else dot.classList.add('hidden');
  }
}

function renderGrid(){
  const grid = document.getElementById('productGrid');

async function toggleWishlist(productId){

  try { await updateDoc(doc(db,'users',currentUser.id), {wishlist: wl}); } catch(e) { console.error(e); }
}

async function loadReviews(productId) {

  if(unsubReviews) unsubReviews();
  unsubReviews = onSnapshot(query(collection(db,'reviews'), where('productId','==',productId)), snap => {
    const revs = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt - a.createdAt);
    if(revs.length === 0) {
      listEl.innerHTML = `<div class="muted" style="text-align:center;padding:10px">Belum ada ulasan untuk produk ini.</div>`;
      return;

    listEl.innerHTML = revs.map(r => {
      let stars = ''; for(let i=1; i<=5; i++) stars += i <= r.rating ? '★' : '☆';
      return `<div class="review-item">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <div style="font-weight:800;color:var(--txt)">${esc(r.buyerName)}</div>
          <div class="stars-display">${stars}</div>
        </div>
        <div style="color:var(--mut);font-size:11.5px">${dateFmt(r.createdAt)}</div>
        <div style="margin-top:6px;color:var(--txt)">${esc(r.comment)}</div>

    }).join('');
  });
}

function applyVoucher(productId) {
  const code = document.getElementById('voucherCode').value.trim().toUpperCase();
  const p = products.find(x=>x.id===productId);
  if(!code) return;
  
  const v = allVouchers.find(v => v.code === code && v.isActive);
  if(!v) { document.getElementById('voucherStatus').innerHTML = `<span style="color:var(--bad)">❌ Kode voucher tidak valid / kadaluarsa.</span>`; return; }
  if(p.price < v.minSpend) { document.getElementById('voucherStatus').innerHTML = `<span style="color:var(--bad)">❌ Minimal belanja ${rp(v.minSpend)} untuk pakai voucher ini.</span>`; return; }

  let discount = v.discountAmount;
  let finalPrice = p.price - discount;
  if(finalPrice < 0) finalPrice = 0;

  appliedVoucher = { code: v.code, discount, finalPrice };
  document.getElementById('priceDisplay').innerHTML = `<span style="text-decoration:line-through;font-size:12px;color:var(--mut);margin-right:6px">${rp(p.price)}</span> ${rp(finalPrice)}`;
  document.getElementById('voucherStatus').innerHTML = `<span style="color:var(--ok)">✅ Voucher berhasil dipakai! Potongan ${rp(discount)}</span>`;
}

async function confirmOrder(productId){
  const p = products.find(x=>x.id===productId); if(!p) return;
  const note = (document.getElementById('orderNote')?.value||'').trim();
  
  let finalPrice = p.price;
  let discountStr = '';
  if(appliedVoucher) {
    finalPrice = appliedVoucher.finalPrice;
    discountStr = ` (Diskon ${rp(appliedVoucher.discount)} via ${appliedVoucher.code})`;
  }

  try{
    const orderData = {
      productId: p.id, productName: p.name, originalPrice: p.price, productPrice: finalPrice, productImage: p.image || '',
      buyerId: currentUser.id, buyerName: currentUser.username, buyerAvatar: currentUser.avatar || '',
      sellerId: p.sellerId, sellerName: p.sellerName,
      sellerEwalletType: p.ewalletType || '', sellerEwalletNumber: p.ewalletNumber || '', sellerPhone: p.phone || '',
      note, status: 'Menunggu Pembayaran', resi: '', createdAt: Date.now(),
      timeline: [{status:'Menunggu Pembayaran', time:Date.now(), note:'Pesanan dibuat' + discountStr}]
    };
    await addDoc(collection(db,'orders'), orderData);
    const chatId = [currentUser.id, p.sellerId].sort().join('_');
    await ensureChat(chatId, currentUser.id, p.sellerId);
    await addDoc(collection(db,'chats',chatId,'messages'), {
      from: currentUser.id, text: `Halo, saya baru pesan *${p.name}* (${rp(finalPrice)}). Mohon info pembayaran ya 🙏`, time: Date.now()
    });
    await updateDoc(doc(db,'chats',chatId), { lastMessage: `Halo, saya baru pesan ${p.name}`, lastTime: Date.now(), lastFrom: currentUser.id });
    closeModal(); currentView='orders'; orderTab='buyer'; render();
    toast('✅ Pesanan dibuat!');
    setTimeout(()=>openChatWith(p.sellerId, p.id), 500);
  }catch(e){ toast('Error: '+e.message); }
}

function statusColor(s){
  if(s==='Menunggu Pembayaran'||s==='Diproses Penjual'||s==='Dikirim') return 'warn';
  if(s==='Sampai Tujuan'||s==='Selesai') return 'ok';
  return 'free';
}

function orderCard(o, role){
  const isBuyer = role==='buyer';

  }
  return `<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:11px">
      <span class="muted">${dateFmt(o.createdAt)}</span>
      <span class="badge ${statusColor(o.status)}">${o.status}</span>

        : `<div style="width:60px;height:60px;border-radius:13px;background:#F3E8FF;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0">🖼️</div>`}
      <div style="flex:1;min-width:0">

      </div>
    </div>

let tmpQr = '';
function previewImg(input, previewId, which){
  const f = input.files && input.files[0]; if(!f) return;
  compressImage(f, which==='qr'?500:600, which==='qr'?0.7:0.55, data=>{
    const el = document.getElementById(previewId);
    if(el){ el.src=data; el.style.display='block'; }
    if(which==='img') tmpImg=data; else tmpQr=data;
  });
}

async function submitProduct(){
  const name = document.getElementById('pName').value.trim();
  const desc = document.getElementById('pDesc').value.trim();
  const price = parseInt(document.getElementById('pPrice').value, 10);
  const phone = document.getElementById('pPhone').value.trim();

  const prem = isPremium(currentUser);

  try{

      name, desc, price, image: tmpImg || '', qr: tmpQr || '',

    };

async function ensureChat(chatId, uid1, uid2){
  const ref = doc(db,'chats',chatId);
  const snap = await getDoc(ref);
  if(!snap.exists()){
    const u1Snap = await getDoc(doc(db,'users',uid1));
    const u2Snap = await getDoc(doc(db,'users',uid2));
    const users = {};
    if(u1Snap.exists()) users[uid1] = {username:u1Snap.data().username, avatar:u1Snap.data().avatar||''};
    if(u2Snap.exists()) users[uid2] = {username:u2Snap.data().username, avatar:u2Snap.data().avatar||''};
    await setDoc(ref, {participants:[uid1,uid2], users, lastMessage:'', lastTime:0, lastFrom:'', unread:{}});
  }
}

async function openChatWith(otherId, productId){
  if(otherId===currentUser.id) return toast('Itu kamu sendiri');
  const chatId = [currentUser.id, otherId].sort().join('_');
  try{
    await ensureChat(chatId, currentUser.id, otherId);
    closeModal(); openChat(chatId);
  }catch(e){ toast('Error: '+e.message); }
}

async function openChat(chatId){
  activeChat = {id:chatId};
  const wrap = document.createElement('div');
  wrap.className = 'chat-wrap'; wrap.id = 'chatWrap';
  wrap.innerHTML = `
    <div class="chat-header"><button class="back" onclick="closeChat()">←</button><div class="who"><div class="nm" id="chatName">Loading...</div></div></div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input-bar">
      <input type="file" id="chatImgInput" accept="image/*" style="display:none" onchange="window.sendChatImage(this)">
      <button class="img-btn" onclick="document.getElementById('chatImgInput').click()">📷</button>
      <input id="chatInput" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="send" onclick="sendMsg()">➤</button>
    </div>
  `;
  document.body.appendChild(wrap);
  document.body.style.overflow='hidden';

  const chatSnap = await getDoc(doc(db,'chats',chatId));
  if(!chatSnap.exists()){ toast('Chat tidak ditemukan'); closeChat(); return; }
  const chatData = chatSnap.data(); activeChat.data = chatData;
  const otherId = chatData.participants.find(p=>p!==currentUser.id);
  const otherInfo = chatData.users?.[otherId] || {username:'User'};
  document.getElementById('chatName').innerHTML = esc(otherInfo.username);

  try{
    const unread = {...(chatData.unread||{})}; unread[currentUser.id] = 0;
    await updateDoc(doc(db,'chats',chatId), {unread});
  }catch(e){}

  if(unsubMessages) unsubMessages();
  unsubMessages = onSnapshot(query(collection(db,'chats',chatId,'messages'), orderBy('time','asc')), snap => {
    const body = document.getElementById('chatBody');
    if(!body) return;
    const msgs = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(msgs.length===0){ body.innerHTML = `<div class="chat-empty"><div style="font-size:52px;opacity:.4">💬</div><p style="margin-top:10px">Belum ada pesan. Mulai percakapan!</p></div>`; return; }
    const wasAtBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 100;
    body.innerHTML = msgs.map(m=>{
      const mine = m.from===currentUser.id;
      let content = '';
      if(m.image) content += `<img src="${m.image}" alt="Gambar">`;
      if(m.text) content += `<div>${esc(m.text)}</div>`;
      return `<div class="msg ${mine?'mine':'theirs'}">${content}<span class="time">${dateFmt(m.time)}</span></div>`;
    }).join('');
    if(wasAtBottom || msgs.length>0) body.scrollTop = body.scrollHeight;
  });
}

function closeChat(){
  if(unsubMessages){ unsubMessages(); unsubMessages=null; }
  const w = document.getElementById('chatWrap');
  if(w) w.remove();
  document.body.style.overflow='';
  activeChat = null; render();
}

async function sendMsg(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text || !activeChat) return;
  input.value = '';
  try{
    await addDoc(collection(db,'chats',activeChat.id,'messages'), { from: currentUser.id, text, time: Date.now() });
    const chatSnap = await getDoc(doc(db,'chats',activeChat.id));
    const otherId = chatSnap.data().participants.find(p=>p!==currentUser.id);
    const unread = {...(chatSnap.data().unread||{})}; unread[otherId] = (unread[otherId]||0) + 1;
    await updateDoc(doc(db,'chats',activeChat.id), { lastMessage: text.length>40 ? text.slice(0,40)+'...' : text, lastTime: Date.now(), lastFrom: currentUser.id, unread });
  }catch(e){ toast('Gagal kirim: '+e.message); }
}

function sendChatImage(input){
  const f = input.files && input.files[0]; if(!f || !activeChat) return;
  toast('Memproses gambar...');
  compressImage(f, 500, 0.6, async data => {
    try{
      await addDoc(collection(db,'chats',activeChat.id,'messages'), { from: currentUser.id, image: data, time: Date.now() });
      const chatSnap = await getDoc(doc(db,'chats',activeChat.id));
      const otherId = chatSnap.data().participants.find(p=>p!==currentUser.id);
      const unread = {...(chatSnap.data().unread||{})}; unread[otherId] = (unread[otherId]||0) + 1;
      await updateDoc(doc(db,'chats',activeChat.id), { lastMessage: '📷 Foto', lastTime: Date.now(), lastFrom: currentUser.id, unread });
      input.value = ''; 
    }catch(e){ toast('Gagal kirim foto: '+e.message); }
  });
}

async function saveUsername(){
  const val = document.getElementById('newUsername').value.trim();
  if(val.length<3) return toast('Minimal 3 karakter');
  if(/\s/.test(val)) return toast('Tidak boleh spasi');
  if(!/^[a-zA-Z0-9._]+$/.test(val)) return toast('Hanya huruf, angka, titik, _');
  const valLower = val.toLowerCase();
  if(valLower === currentUser.usernameLower) return closeModal();
  try{
    if(valLower === ADMIN_USER) return toast('Username ini dilindungi');
    const newRef = doc(db, 'users', valLower); const snap = await getDoc(newRef);
    if(snap.exists()) return toast('Username sudah dipakai');
    const oldId = currentUser.id; const newData = { ...currentUser, username: val, usernameLower: valLower }; delete newData.id;
    await setDoc(newRef, newData); await deleteDoc(doc(db, 'users', oldId));
    const myProdQ = query(collection(db,'products'), where('sellerId','==',oldId)); const prodSnap = await getDocs(myProdQ); prodSnap.docs.forEach(async d=>{ await updateDoc(doc(db,'products',d.id), {sellerId: valLower, sellerName:val}); });
    const buySnap = await getDocs(query(collection(db,'orders'), where('buyerId','==',oldId))); buySnap.docs.forEach(async d=>{ await updateDoc(doc(db,'orders',d.id), {buyerId: valLower, buyerName:val}); });
    const sellSnap = await getDocs(query(collection(db,'orders'), where('sellerId','==',oldId))); sellSnap.docs.forEach(async d=>{ await updateDoc(doc(db,'orders',d.id), {sellerId: valLower, sellerName:val}); });
    const chatSnap = await getDocs(query(collection(db,'chats'), where('participants','array-contains',oldId))); chatSnap.docs.forEach(async d=>{ const chatData = d.data(); const newParticipants = chatData.participants.map(p => p === oldId ? valLower : p); await updateDoc(doc(db,'chats',d.id), {participants: newParticipants}); });
    currentUser.id = valLower; currentUser.username = val; currentUser.usernameLower = valLower; localStorage.setItem('rullzUserId', valLower);
    closeModal(); render(); toast('✅ Username diperbarui');
  }catch(e){ toast('Error: '+e.message); }
}

function uploadAd(input) {
  const file = input.files[0]; if (!file) return;
  toast('Memproses foto iklan...');
  compressImage(file, 1200, 0.8, async (mediaBase64) => {
    try {
      if (ads.length > 0) await deleteDoc(doc(db, 'ads', ads[0].id));
      await addDoc(collection(db, 'ads'), { media: mediaBase64, createdAt: Date.now() });
      toast('✅ Iklan berhasil diupload!'); input.value = '';
    } catch (error) { toast('Gagal upload iklan: ' + error.message); }
  });
}
function deleteAd(id) { if (!confirm('Hapus iklan ini?')) return; deleteDoc(doc(db, 'ads', id)).then(() => toast('🗑️ Iklan dihapus')).catch(e => toast('Error: ' + e.message)); }

function createVoucher() {
  const code = document.getElementById('vCode').value.trim().toUpperCase();
  const disc = parseInt(document.getElementById('vDisc').value);
  const min = parseInt(document.getElementById('vMin').value) || 0;
  if(!code || !disc) return toast('Isi Kode dan Diskon');
  if(allVouchers.find(v => v.code === code)) return toast('Kode voucher sudah ada');
  addDoc(collection(db, 'vouchers'), { code, discountAmount: disc, minSpend: min, isActive: true })
    .then(() => { document.getElementById('vCode').value=''; document.getElementById('vDisc').value=''; document.getElementById('vMin').value=''; toast('✅ Voucher dibuat!'); })
    .catch(e => toast(e.message));
}
function deleteVoucher(id) { if (!confirm('Hapus voucher ini?')) return; deleteDoc(doc(db, 'vouchers', id)).then(() => toast('🗑️ Voucher dihapus')).catch(e => toast(e.message)); }

function deleteProductAdmin(id) {
  const p = products.find(x=>x.id===id); if(!p) return;
  if (!confirm('Hapus produk "'+p.name+'" milik '+p.sellerName+'?')) return;
  deleteDoc(doc(db, 'products', id)).then(() => toast('🗑️ Produk dihapus oleh Admin')).catch(e => toast(e.message));
}

function toggleBlock(id){
  const u = allUsers.find(x=>x.id===id); if(!u) return;
  updateDoc(doc(db,'users',id), {blocked:!u.blocked}).then(()=>{
    toast(u.blocked?'🔓 User dibuka':'🚫 User diblokir');
    if(id===currentUser.id && !u.blocked){ setTimeout(()=>logout(),800); }
  }).catch(e=>toast('Error: '+e.message));
}

function togglePremium(id){
  const u = allUsers.find(x=>x.id===id); if(!u) return;
  const action = isPremium(u) ? updateDoc(doc(db,'users',id), {isPremium:false, premiumUntil:0}) : updateDoc(doc(db,'users',id), {isPremium:true, premiumUntil:Date.now()+30*86400000});
  action.then(()=>toast('✅ Premium diubah')).catch(e=>toast('Error: '+e.message));
}
